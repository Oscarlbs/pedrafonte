# Catálogo de edificios de Pedrafonte. Editable.
#
# Cada entrada:
#   clave        identificador (no cambiar una vez usado en una partida)
#   nombre       como se ve en el juego
#   categoria    vivienda | produccion | servicio | defensa | camino | adorno
#   tam          [ancho, fondo] en celdas de 2 m
#   coste        recursos que se pagan al construir (grano, madera, piedra, oro)
#   requisitos   poblacion: mínimo de vecinos · edificios: [claves que deben existir] ·
#                terreno: orilla (al menos una celda en la orilla del río) · unico: true (solo uno)
#   efecto       vivienda: plazas · trabajadores: cuántos necesita · oficios: [los que rinden al 100 %] ·
#                produce / consume: por día con un trabajador del oficio · estacional: true (×estación) ·
#                comida_extra: raciones diarias que ahorra · animo / salud / defensa / autoridad: puntos ·
#                oro_dia: oro diario · almacen: evita que el grano se pierda · arrastre: true (se pinta en fila) ·
#                tropas: hombres de armas que caben (guerra.yaml)
#   modelo       constructor 3D que usa el juego (juego/src/escena/edificios.ts)
#   descripcion  texto del menú, con su retranca

- clave: choza
  nombre: Choza
  categoria: vivienda
  tam: [3, 3]
  coste: {madera: 8}
  efecto: {vivienda: 2}
  modelo: choza
  descripcion: Cuatro palos y un tejado. Gotea, pero poco.

- clave: casa
  nombre: Casa de entramado
  categoria: vivienda
  tam: [3, 3]
  coste: {madera: 16, piedra: 4}
  efecto: {vivienda: 4, animo: 1}
  modelo: casa
  descripcion: Rechoncha, de vigas vistas y paja nueva. Cabe una familia y sus discusiones.

- clave: casa_grande
  nombre: Casa grande
  categoria: vivienda
  tam: [4, 3]
  coste: {madera: 26, piedra: 10, oro: 5}
  requisitos: {poblacion: 8}
  efecto: {vivienda: 6, animo: 1}
  modelo: casa_grande
  descripcion: Dos alturas y chimenea de piedra. Los vecinos dirán que es presumir.

- clave: casa_senor
  nombre: Casona del señor
  categoria: vivienda
  tam: [5, 4]
  coste: {madera: 30, piedra: 20}
  requisitos: {unico: true}
  efecto: {autoridad: 10, animo: 1}
  modelo: casona
  descripcion: Vuestra casa. Con balcón, para saludar o para que os vean ceñudo.

- clave: hoguera
  nombre: Hoguera
  categoria: servicio
  tam: [2, 2]
  coste: {madera: 2}
  efecto: {animo: 1, calor: true}
  modelo: hoguera
  descripcion: Donde se calientan las manos y las lenguas.

- clave: pozo
  nombre: Pozo
  categoria: servicio
  tam: [2, 2]
  coste: {piedra: 8}
  efecto: {salud: 2, animo: 1}
  modelo: pozo
  descripcion: Agua fresca y el mejor sitio para enterarse de todo.

- clave: campo
  nombre: Campo de trigo
  categoria: produccion
  tam: [4, 4]
  coste: {madera: 2}
  efecto: {trabajadores: 1, oficios: [viuda, mozo, labrador], produce: {grano: 6}, estacional: true}
  modelo: campo
  descripcion: Se siembra en primavera, se siega en verano y se mira con preocupación el resto del año.

- clave: huerto
