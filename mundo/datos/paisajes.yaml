# Paisajes de las aldeas. Editable. Lo leen las dos partes: el mundo (para saber qué celdas son agua,
# orilla o bosque) y el juego (para dibujar el terreno).
#
# Todo va en celdas de la cuadrícula (56 × 56, de 2 m). Norte = z pequeño.
#   rio.puntos     eje del río como polilínea [cx, cz]; puede salirse del mapa por los bordes
#   rio.anchura    en celdas. Agua: centro de la celda a menos de anchura/2 del eje.
#                  Orilla: a menos de anchura/2 + 2.
#   puente         rectángulo fijo que cruza el río: esquina [cx, cz], tam [ancho, fondo]
#   camino         polilíneas del camino real (celdas de camino ya puestas al empezar)
#   claro          centro y radio del claro inicial, sin árboles
#   inicio         dónde van la choza, la hoguera y los colonos al empezar
#   solar_molino   sitio recomendado para el molino (lo usa el Escaparate)
#   bosques/rocas  manchas [cx, cz, radio, densidad 0–1]
#   relieve        alturas en metros: borde (laderas), cauce (fondo del río), ondulacion
#   recursos       multiplicadores de producción del paisaje

valle:
  nombre: Valle con río
  descripcion: Un valle recogido, con el río bajando del norte, un puente viejo y sitio para un molino.
  celdas: 56
  rio:
    anchura: 3.2
    puntos: [[39, -3], [38, 5], [41, 12], [39, 19], [35, 25], [34, 30], [36, 36], [40, 42], [38, 49], [36, 59]]
  puente: {celda: [32, 29], tam: [5, 2], modelo: bridge01}
  camino:
    - [[0, 31], [8, 30], [16, 30], [24, 29], [31, 29]]
    - [[37, 29], [44, 28], [50, 28], [55, 27]]
  claro: {centro: [22, 27], radio: 10}
  inicio:
    choza: [18, 23]
    hoguera: [22, 27]
    colonos: [[21, 26], [24, 27], [22, 25], [20, 28]]
    senor: [24, 25]
  solar_molino: [31, 20]
  bosques:
    - [6, 8, 9, 0.9]
    - [10, 46, 10, 0.9]
    - [48, 8, 8, 0.8]
    - [50, 44, 9, 0.9]
    - [24, 6, 7, 0.6]
    - [26, 50, 7, 0.7]
    - [3, 26, 5, 0.6]
    - [52, 24, 5, 0.6]
  rocas:
    - [12, 12, 4, 0.5]
    - [46, 36, 4, 0.5]
    - [44, 16, 3, 0.4]
  relieve: {borde: 7.0, cauce: -1.6, ondulacion: 0.5}
  recursos: {grano: 1.0, madera: 1.0, piedra: 1.0}

