# Ajustes de los motores de IA. Editable. El motor se elige con la variable ALDEA_MOTOR_IA.

simulado:
  # Escenas como mucho al día (cuando coinciden vecinos). No cuesta nada: es solo para no saturar.
  escenas_por_dia: 8

claude:
  # Modelo de Anthropic que interpreta a los vecinos. Otros más baratos: claude-sonnet-5-5, claude-haiku-5-5.
  modelo: claude-opus-5-5
  # Cuánto «piensa» el modelo: low, medium, high. Para charlas de aldea, low sobra.
  esfuerzo: low
  # Tope de gasto al día por aldea, en dólares. Pasado el tope, contesta el motor simulado hasta mañana.
  # (El código no deja subirlo de 5.)
  tope_diario_usd: 1.0
  # Tope de tokens de salida por llamada.
  max_tokens: 4000
  # Escenas como mucho al día (cada escena es una llamada de pago).
  escenas_por_dia: 6
  # Precios en dólares por millón de tokens, para llevar la cuenta. Actualízalos si cambian.
  precios_usd_por_millon:
    claude-opus-5-5: {entrada: 4.0, salida: 20.0}
    claude-sonnet-5-5: {entrada: 2.0, salida: 10.0}
    claude-haiku-5-5: {entrada: 0.1, salida: 0.5}
