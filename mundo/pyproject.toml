[project]
name = "aldea-mundo"
version = "0.1.0"
description = "Servidor del mundo de Pedrafonte: el motor decide, la IA interpreta"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tzdata>=2024.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aldea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
