# Migraciones de la base de datos del mundo.
#   cd mundo && .venv/bin/alembic upgrade head
#   cd mundo && .venv/bin/alembic revision --autogenerate -m "lo que cambia"
# La dirección de la base de datos sale de ALDEA_BD_URL (.env), no de este archivo.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s: %(message)s
